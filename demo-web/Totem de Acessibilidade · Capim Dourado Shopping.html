<title>Totem de Acessibilidade · Capim Dourado Shopping</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--bg:#f2f5f1;--fg:#13261c;--card:#fff;--pri:#0f4d37;--on:#fff;--gold:#f2b705;--bd:#b9c7bd;--mut:#4a5d52;--warn:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a13;--fg:#eef4ef;--card:#16281e;--pri:#f2b705;--on:#13261c;--bd:#35503f;--mut:#a9bdb0;--warn:#ff8a80}}
:root[data-theme="dark"]{--bg:#0d1a13;--fg:#eef4ef;--card:#16281e;--pri:#f2b705;--on:#13261c;--bd:#35503f;--mut:#a9bdb0;--warn:#ff8a80}
html[data-hc]{--bg:#000;--fg:#ffe600;--card:#000;--pri:#ffe600;--on:#000;--bd:#ffe600;--mut:#fff;--warn:#fff}
html{height:100%;font-size:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html[data-big]{font-size:128%}
html[data-horror]:not([data-hc]){--bg:#070000;--fg:#eadbd3;--card:#150404;--pri:#d91c1c;--on:#fff;--gold:#7a0000;--bd:#6b1414;--mut:#c19a94;--warn:#ff3b30}
html[data-horror]:not([data-hc]) body{background:radial-gradient(ellipse at 50% 0,#2a0606 0,#070000 70%) fixed}
html[data-horror] header{border-bottom-color:#8b0000}
html[data-horror] h1,html[data-horror] header strong{font-family:"Creepster","Atkinson Hyperlegible",cursive;font-weight:400;letter-spacing:.06em;color:#e01b1b;text-shadow:0 0 12px #600}
html[data-horror] h1{animation:fl 3s steps(1) infinite}
html[data-horror] .ic{filter:grayscale(1) sepia(1) hue-rotate(-40deg) saturate(5)}
html[data-horror] svg g.sel text{fill:#fff}

body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:1.1rem;line-height:1.5}
html[data-dys] body{font-family:"Lexend","Trebuchet MS",sans-serif;letter-spacing:.04em;word-spacing:.12em;line-height:1.8}
#app{max-width:880px;margin:0 auto;padding:12px 16px 40px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 0 12px;border-bottom:3px solid var(--gold)}
header strong{font-size:1.05rem;flex:1;min-width:180px}
.tools{display:flex;gap:8px;flex-wrap:wrap;padding:12px 0}
button{font:inherit;color:var(--fg);cursor:pointer}
.b{min-height:56px;padding:10px 18px;border:3px solid var(--bd);border-radius:14px;background:var(--card);font-weight:700;font-size:1.1rem;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.b[aria-pressed="true"]{border-color:var(--pri);box-shadow:inset 0 0 0 2px var(--pri)}
.p{background:var(--pri);color:var(--on);border-color:var(--pri)}
.b:focus-visible,.cell:focus-visible{outline:4px solid var(--fg);outline-offset:3px}
h1{font-size:2rem;line-height:1.2;margin:16px 0 8px}
h2{font-size:1.3rem;margin:20px 0 8px}
.sub{color:var(--mut);margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:140px;padding:16px;border:3px solid var(--bd);border-radius:20px;background:var(--card);font-weight:700;font-size:1.2rem;text-align:center}
.cell .ic{font-size:2.8rem;line-height:1}
.cell:hover{border-color:var(--pri)}
.cell.help{border-color:var(--warn)}
.row{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border-radius:16px;background:var(--pri);color:var(--on);font-weight:700;margin:12px 0}
.banner .b{background:var(--card);border-color:var(--card)}
.langs .b{flex:1;min-width:150px;min-height:84px;font-size:1.4rem}
.mapbox{border:3px solid var(--bd);border-radius:16px;background:var(--card);overflow-x:auto}
svg{display:block;width:100%;min-width:480px;height:auto}
svg .cor{fill:var(--bg);stroke:var(--bd);stroke-width:1}
svg .st{fill:var(--card);stroke:var(--bd);stroke-width:2}
svg g.sel .st{fill:var(--gold);stroke:var(--fg);stroke-width:3}
svg g.sel text{fill:#13261c}
svg text{fill:var(--fg);font-size:12px;font-weight:700;text-anchor:middle;font-family:inherit}
svg .route{fill:none;stroke:var(--pri);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:4 12;animation:dash 1s linear infinite}
html[data-theme="light"] svg .route{stroke:var(--pri)}
@keyframes dash{to{stroke-dashoffset:-16}}
@media (prefers-reduced-motion:reduce){svg .route{animation:none}}
.steps{padding:14px 16px;border-left:8px solid var(--gold);background:var(--card);border-radius:0 14px 14px 0;margin:14px 0;font-size:1.15rem}
.sent{min-height:72px;padding:12px 16px;border:3px dashed var(--bd);border-radius:16px;background:var(--card);font-size:1.5rem;font-weight:700;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.status{padding:18px;border:3px solid var(--pri);border-radius:18px;background:var(--card);font-size:1.25rem;font-weight:700;margin:14px 0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:700;max-width:90vw;display:none;z-index:9}
h1:focus{outline:none}
#modeBtn{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;z-index:6;min-height:44px;padding:6px 12px;font-size:.95rem}
html[data-mode="phone"] .chrome{display:none}
html[data-mode="phone"] #app{padding-top:56px}
.qr svg{width:100%;height:100%;display:block}
html[data-mode="totem"]:not([data-horror]):not([data-hc]) body{background:linear-gradient(#eef1f3,#c9d1d8)}
html[data-mode="totem"] #stage{position:relative;height:calc(1160px*var(--k,1));overflow:hidden}
html[data-mode="totem"] #rig{position:absolute;left:50%;top:0;width:640px;height:1160px;display:flex;gap:20px;align-items:flex-start;transform:translateX(-50%) scale(var(--k,1));transform-origin:top center}

html[data-mode="totem"] .sign{width:100%;background:#fff;color:#12296a;font-weight:700;font-size:30px;letter-spacing:.08em;text-align:center;padding:14px 0;border-radius:6px;box-shadow:0 0 24px #fff8}
html[data-mode="totem"] .slogan{color:#fff;text-align:center;margin:22px 0 18px;line-height:1.1}

html[data-mode="totem"] .bezel{width:100%;background:#000;padding:12px;border-radius:18px;box-sizing:border-box}

.tb{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--card);border-bottom:2px solid var(--bd)}

.tbody{flex:1;overflow-y:auto;padding:12px 14px}

.tn{display:flex;justify-content:space-around;padding:6px;background:var(--card);border-top:2px solid var(--bd)}

.under{display:flex;align-items:center;gap:14px;margin-top:18px;width:100%;color:#fff;font-size:15px}
.under .qr{flex:none;width:130px;height:130px;padding:6px;background:#fff;border-radius:6px;box-sizing:border-box}
.under p{margin:0}
html[data-mode="totem"] .logos{margin-top:auto;width:calc(100% + 32px);background:#fff;color:#12296a;font-weight:700;text-align:center;padding:16px 8px;border-top:6px solid #c9a227;box-sizing:border-box}
#plaque{width:150px;margin-top:330px;flex:none;background:#12296a;color:#fff;border:3px solid #c9a227;border-radius:10px;padding:12px;font-size:12px;text-align:center;box-sizing:border-box}

#plaque span{font-size:22px;letter-spacing:.1em}
.phys{display:block;width:84px;height:84px;margin:10px auto 0;border-radius:50%;border:5px solid #fff;background:#f2c200;color:#13261c;font-weight:700;font-size:13px;line-height:1.1;cursor:pointer}
.phys:focus-visible{outline:4px solid #fff;outline-offset:3px}
.splash{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;width:100%;flex:1;min-height:100%;border:0;background:#666d4e;color:#f4ead2;font:inherit;font-size:1.3rem;font-weight:700;cursor:pointer;padding:24px;box-sizing:border-box}
.splash img{width:min(100%,380px);height:auto;border-radius:16px}
.splash span{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
html[data-mode="phone"] .splash{min-height:85vh}
.splash:focus-visible{outline:5px solid #f2b705;outline-offset:-8px}
svg .rt0{fill:none;stroke:#fff;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
svg .route{stroke:#d1006b;stroke-width:6}
svg .pin{fill:#f2b705;stroke:#13261c;stroke-width:3}
svg g.sel .pin{fill:#d1006b;stroke:#fff}
svg text.pn,svg g.sel text.pn,html[data-horror] svg g.sel text.pn{font-size:15px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:4px;fill:#13261c;text-anchor:middle}
#screen{position:relative}
#spider,#web{display:none;position:absolute;pointer-events:none;z-index:5}
html[data-horror] #spider{display:flex}
html[data-horror] #web{display:block}
#web{top:0;left:0;font-size:64px;line-height:1;opacity:.85}
#spider{top:0;right:46px;flex-direction:column;align-items:center;animation:drop 8s ease-in-out infinite}
#spider i{width:2px;height:300px;background:#cfc3bd}
#spider b{font-size:42px;line-height:1;font-weight:400;margin-top:-4px;animation:sway 2s ease-in-out infinite alternate}
@keyframes drop{0%,100%{transform:translateY(-350px)}45%,62%{transform:translateY(-110px)}}
@keyframes sway{to{transform:rotate(8deg)}}
html[data-mode="phone"] #spider,html[data-mode="phone"] #web{position:fixed}
@media (prefers-reduced-motion:reduce){#spider{animation:none;transform:translateY(-110px)}#spider b,.splash span{animation:none}}
</style>
</head>

function tools(){const on=(k,l,a)=>`<button class="b" data-a="${a}" aria-pressed="${S[k]}">${l}</button>`;
 return `<div class="tools" role="group" aria-label="Acessibilidade">${on("voice","🔊 "+(S.voice?t.off:t.enable),"voice")}${on("hc","◐ "+t.hc,"hc")}${on("big","A+ "+t.big,"big")}${on("dys","Aa "+t.dys,"dys")}<button class="b" data-a="mic">🎤 ${t.mic}</button></div>`}
function nav(){return `<div class="row">${S.scr!="menu"?`<button class="b" data-a="go" data-v="${S.scr=="map"?"list":"menu"}">← ${t.back}</button>`:""}${S.scr!="home"?`<button class="b" data-a="go" data-v="home">⌂ ${t.home}</button>`:""}</div>`}
function view(){let h="",say_="";
 if(S.scr=="home"){say_=t.hello+" "+t.pick+" "+(S.voice?t.on:"");
  h=`<h1 tabindex="-1">${t.hello}</h1><p class="sub">${t.pick}</p>
  <div class="row langs">${[["pt","🇧🇷 Português"],["en","🇺🇸 English"],["es","🇪🇸 Español"]].map(l=>`<button class="b ${S.lang==l[0]?"p":""}" data-a="lang" data-v="${l[0]}" lang="${l[0]}">${l[1]}</button>`).join("")}</div>
  ${S.voice&&S.ban?`<div class="banner" role="alert">🔊 ${t.on}<button class="b" data-a="voice">${t.off}</button></div>`:""}
  <div class="row"><button class="b p" style="flex:1;min-height:80px;font-size:1.4rem" data-a="go" data-v="menu">${t.menu} →</button></div><p class="sub">${t.qr}</p>`}
 if(S.scr=="menu"){say_=t.menu;
  h=`<h1 tabindex="-1">${t.menu}</h1><div class="grid">${(S.mode=="totem"?["shops","food","wc"]:["shops","food","wc","caa","help"]).map(k=>`<button class="cell ${k=="help"?"help":""}" data-a="${k=="caa"||k=="help"?"go":"cat"}" data-v="${k}"><span class="ic" aria-hidden="true">${IC[k]}</span>${t[k]}</button>`).join("")}</div>`}
 if(S.scr=="list"){say_=t.pickPlace+": "+t[S.cat];
  h=`<h1 tabindex="-1">${t[S.cat]}</h1><p class="sub">${t.pickPlace}</p><div class="grid">${D[S.cat].map((p,i)=>`<button class="cell" style="min-height:96px" data-a="dest" data-v="${i}"><span class="ic" aria-hidden="true">${IC[S.cat]}</span>${nm(p)}</button>`).join("")}</div>`}
 if(S.scr=="map"){const d=S.dest,pr=path(d),l=S.acc?t.lift:t.esc,m=dist(pr),st=(d[1]==1?t.s1:t.s2).replace("{n}",nm(d)).replace("{v}",l),w=t.walk.replace("{m}",m).replace("{t}",Math.max(1,Math.round(m/45*(S.acc?1.3:1))));
  say_=t.route+" "+nm(d)+". "+st+" "+w;
  h=`<h1 tabindex="-1">${t.route} ${nm(d)}</h1>
  <div class="row"><button class="b" data-a="acc" aria-pressed="${S.acc}">♿ ${t.acc}</button><button class="b" data-a="std" aria-pressed="${!S.acc}">${t.std}</button></div>
  <div class="row" role="group" aria-label="${t.floor}">${[1,2].map(f=>`<button class="b" data-a="floor" data-v="${f}" aria-pressed="${S.floor==f}">${t.floor} ${f}</button>`).join("")}</div>
  <div class="mapbox">${svg()}</div><div class="steps">${st}<br><span class="sub">${w}</span></div>`}
 if(S.scr=="caa"){say_=t.caa;
  h=`<h1 tabindex="-1">${t.caa}</h1><div class="sent" aria-live="polite">${S.sent.length?S.sent.map(i=>`<span>${CAA[i]} ${t.caaL[i]}</span>`).join(""):`<span class="sub">${t.empty}</span>`}</div>
  <div class="row"><button class="b p" data-a="say">🔊 ${t.say}</button><button class="b" data-a="clr">✖ ${t.clear}</button></div>
  <div class="grid">${CAA.map((c,i)=>`<button class="cell" style="min-height:120px" data-a="caa" data-v="${i}"><span class="ic" aria-hidden="true">${c}</span>${t.caaL[i]}</button>`).join("")}</div>`}
 if(S.scr=="help"){say_=S.helped?t.helpOk:t.helpT;
  h=`<h1 tabindex="-1">${t.helpT}</h1>`+(S.helped?`<div class="status" role="status">✅ ${t.helpOk}<br><span class="sub">${t.helpS}</span></div><p class="sub">${t.proto}</p>`:`<button class="b p" style="width:100%;min-height:120px;font-size:1.6rem;background:var(--warn);border-color:var(--warn);color:#fff" data-a="call">🆘 ${t.helpB}</button>`)}
 return {h,say_}}

function qr(){let s=7;const r=()=>(s=s*16807%2147483647)/2147483647,n=25,f=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3"/>`;
 let h=`<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges"><rect width="${n}" height="${n}" fill="#fff"/>`;
 for(let y=0;y<n;y++)for(let x=0;x<n;x++){const e=(x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9);if(!e&&r()>.5)h+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
 return h+f(0,0)+f(n-7,0)+f(0,n-7)+"</svg>"}
function tiles(X){const a=[["go","menu","🗺️",X[2],"#1e6fe0","#fff"],["go","help","🆘",X[3],"#d62828","#fff"],["go","caa","▦",X[4],"#f2c200","#13261c"],["mic","","🎙️",X[5],"#f08a00","#13261c"]];

const TS={pt:"Toque em qualquer lugar para começar",en:"Touch anywhere to start",es:"Toque en cualquier lugar para comenzar"};
function splash(){return `<button class="splash" data-a="start" aria-label="${TS[S.lang]}"><img src="${LOGO}" alt="Capim Dourado Shopping"><span>${TS[S.lang]}</span></button>`}
function render(speak=true){t=T[S.lang];const R=document.documentElement;R.lang=LC[S.lang];R.dataset.mode=S.mode;$("modeBtn").textContent=TX[S.lang][S.mode=="totem"?6:7];fit();["hc","big","dys","horror"].forEach(k=>S[k]?R.setAttribute("data-"+k,""):R.removeAttribute("data-"+k));
 if(S.scr=="splash"){$("app").innerHTML=splash();return}const v=view();$("app").innerHTML=S.mode=="totem"?tview(v):`<header><strong>${S.horror?"🩸":"🌾"} ${t.brand}</strong></header>${tools()}${nav()}${v.h}`;
 const h=document.querySelector("h1");if(h&&S.scr!="home")h.focus({preventScroll:true});
 if(speak)say(v.say_)}
function cmd(s){s=s.toLowerCase();const m=[["help",/ajuda|atendente|help|staff|ayuda|asistente/],["wc",/banheiro|toilet|restroom|bathroom|baño|servicio|wc/],["food",/comer|comida|food|eat|aliment|lazer|cinema/],["shops",/loja|shop|store|tienda/],["caa",/imagem|imagens|picture|imagen|pictograma/]];
 const f=m.find(x=>x[1].test(s));if(!f){toast(t.miss);say(t.miss);return}
 if(f[0]=="help"||f[0]=="caa")S.scr=f[0];else{S.cat=f[0];S.scr="list"}render()}
function mic(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){toast(t.noSR);return}
 try{const r=new R();r.lang=LC[S.lang];r.onresult=e=>cmd(e.results[0][0].transcript);r.onerror=()=>toast(t.noSR);r.start();toast(t.lis)}catch(e){toast(t.noSR)}}
function act(a,v){
 if(a=="start"){S.scr="home";render();return}
 if(a=="mode"){S.mode=S.mode=="totem"?"phone":"totem";render(false);return}
 if(a=="phys"){S.scr="help";S.helped=true;render();return}
 if(a=="voice"){S.voice=!S.voice;S.ban=false;if(!S.voice&&window.speechSynthesis)speechSynthesis.cancel();render(S.voice);return}
 if(["hc","big","dys"].includes(a)){S[a]=!S[a];render(false);return}
 if(a=="mic"){mic();return}
 if(a=="lang"){S.lang=v;render();return}
 if(a=="go"){S.scr=v;if(v=="help")S.helped=false;render();return}
 if(a=="cat"){S.cat=v;S.scr="list";render();return}
 if(a=="dest"){S.dest=D[S.cat][+v];S.floor=1;S.scr="map";render();return}
 if(a=="acc"||a=="std"){S.acc=a=="acc";S.floor=1;render();return}
 if(a=="floor"){S.floor=+v;render(false);return}
 if(a=="caa"){S.sent.push(+v);render(false);say(t.caaL[+v]);return}
 if(a=="clr"){S.sent=[];render(false);return}
 if(a=="say"){say(S.sent.map(i=>t.caaL[i]).join(". "));return}
 if(a=="call"){S.helped=true;render();}}
function horrorFx(){const m={pt:["Você não devia ter apertado isso…","Tudo voltou ao normal."],en:["You should not have pressed that…","Everything is back to normal."],es:["No debió presionar eso…","Todo volvió a la normalidad."]}[S.lang][S.horror?0:1];toast((S.horror?"🩸 ":"")+m);say(m)}
let LK="",LT=0;
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const k=b.dataset.a+":"+(b.dataset.v||""),n=Date.now();
 if(k==LK&&n-LT<900&&!["caa","call","say","clr","phys"].includes(b.dataset.a)){LK="";S.horror=!S.horror;render(false);horrorFx();return}
 LK=k;LT=n;act(b.dataset.a,b.dataset.v)});
render(false);document.querySelectorAll(".qr").forEach(e=>{e.innerHTML=qr();e.setAttribute("role","img");e.setAttribute("aria-label","QR Code")});addEventListener("resize",fit);
